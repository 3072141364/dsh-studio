<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新建模式 · 弹窗 Mockup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-100 via-white to-blue-50 font-sans antialiased flex items-center justify-center p-6">

  <!-- 新建模式 弹窗 -->
  <div class="w-[400px] max-w-[calc(100vw-2rem)] bg-white rounded-2xl shadow-xl ring-1 ring-slate-900/5 overflow-hidden">

    <!-- 头部 -->
    <div class="flex items-center gap-3 px-6 pt-6 pb-4">
      <div class="w-10 h-10 shrink-0 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
          <line x1="4" y1="21" x2="4" y2="14" />
          <line x1="4" y1="10" x2="4" y2="3" />
          <line x1="12" y1="21" x2="12" y2="12" />
          <line x1="12" y1="8" x2="12" y2="3" />
          <line x1="20" y1="21" x2="20" y2="16" />
          <line x1="20" y1="12" x2="20" y2="3" />
          <line x1="1" y1="14" x2="7" y2="14" />
          <line x1="9" y1="8" x2="15" y2="8" />
          <line x1="17" y1="16" x2="23" y2="16" />
        </svg>
      </div>
      <h2 class="text-base font-semibold text-slate-800">新建模式</h2>
      <button type="button" aria-label="关闭" class="ml-auto w-8 h-8 shrink-0 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors duration-200 flex items-center justify-center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <!-- 主体 -->
    <div class="px-6 pb-6">
      <input
        id="mode-name"
        type="text"
        placeholder="模式名称（如：工作、研究）"
        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white transition-all duration-300"
      />
      <p class="text-xs text-slate-400 mt-3 flex items-center gap-1.5">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 shrink-0">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="16" x2="12" y2="12" />
          <line x1="12" y1="8" x2="12.01" y2="8" />
        </svg>
        创建后，再通过模式右侧的编辑按钮导入 / 移除技能。
      </p>
    </div>

    <!-- 底部 -->
    <div class="border-t border-slate-100 px-6 py-4 flex justify-end gap-3">
      <button type="button" class="text-slate-600 bg-transparent hover:bg-slate-100 rounded-lg px-4 py-2 text-sm font-medium transition-colors duration-200">
        取消
      </button>
      <button
        id="create-btn"
        type="button"
        class="bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-medium rounded-lg px-6 py-2 text-sm shadow-lg shadow-blue-500/20 hover:opacity-90 transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none"
      >
        创建
      </button>
    </div>

  </div>

  <script>
    const input = document.getElementById('mode-name');
    const createBtn = document.getElementById('create-btn');
    const sync = () => { createBtn.disabled = input.value.trim() === ''; };
    input.addEventListener('input', sync);
    sync();
  </script>
</body>
</html>
